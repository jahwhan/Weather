name: Veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build (inklusive Typpruefung)
        run: npm run build

      - name: Seite fuer GitHub Pages verpacken
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Auf GitHub Pages veröffentlichen
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
