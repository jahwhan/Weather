<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Interaktive 3D-Wetterkarte: Ort oder Route eingeben, abspielen und das Live-Wetter mit Licht, Sonnenstand, Nebel und Niederschlag entlang der Strecke sehen." />
    <title>Wetterflug</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cpath d='M5 23c5-1 6-10 11-11s6 6 11-3' fill='none' stroke='%23ff2e93' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23ffd36b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map" aria-label="3D-Karte"></div>

    <main class="hud">
      <section class="panel cmd" id="cmd" aria-label="Ort oder Route">
        <header class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 24c5-1 7-11 12-12s7 6 13-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <circle cx="25" cy="8" r="3.2" fill="var(--sun)" />
          </svg>
          <h1>Wetterflug</h1>
          <span class="live" id="liveBadge" title="Wetterdaten werden live geladen">Live</span>
          <button type="button" class="opts-toggle" id="optsBtn" aria-expanded="false" aria-controls="cmdOpts">Optionen</button>
        </header>

        <form class="route-form" id="routeForm" autocomplete="off">
          <div class="field">
            <input
              id="routeInput"
              name="route"
              type="text"
              inputmode="search"
              spellcheck="false"
              placeholder="Ort oder Route, z. B. Basel bis Luzern"
              aria-label="Ort oder Route"
              aria-autocomplete="list"
              aria-controls="suggest"
            />
            <button type="button" class="icon-btn clear" id="clearBtn" aria-label="Eingabe leeren">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            </button>
          </div>
          <button type="submit" class="play-btn" id="playBtn">
            <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor" /></svg>
            <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" fill="currentColor" /></svg>
            <span id="playLabel">Abspielen</span>
          </button>
          <ul class="suggest" id="suggest" role="listbox" hidden></ul>
        </form>

        <div class="opts-wrap" id="cmdOpts">
        <div class="opts">
          <div class="seg" id="profileSeg" role="radiogroup" aria-label="Fortbewegung">
            <button type="button" role="radio" data-v="bike" aria-checked="true">Velo</button>
            <button type="button" role="radio" data-v="foot" aria-checked="false">Zu Fuss</button>
            <button type="button" role="radio" data-v="car" aria-checked="false">Auto</button>
            <button type="button" role="radio" data-v="flight" aria-checked="false">Flug</button>
          </div>
        </div>
        <div class="opts">
          <div class="seg" id="timeSeg" role="radiogroup" aria-label="Zeit">
            <button type="button" role="radio" data-v="live" aria-checked="true" title="Aktuelles Wetter an jedem Punkt">Jetzt</button>
            <button type="button" role="radio" data-v="travel" aria-checked="false" id="travelBtn" title="Wetter zur Zeit, zu der man dort ankommt">Unterwegs</button>
          </div>
          <label class="select" for="departSel">
            <span>Start</span>
            <select id="departSel"></select>
          </label>
          <label class="select" for="durSel">
            <span>Dauer</span>
            <select id="durSel">
              <option value="auto">Auto</option>
              <option value="8">8 s</option>
              <option value="10">10 s</option>
              <option value="12">12 s</option>
              <option value="14">14 s</option>
              <option value="16">16 s</option>
            </select>
          </label>
        </div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <aside class="panel wx" id="wx" aria-label="Wetter an der aktuellen Position"></aside>

      <section class="panel timeline" id="timeline" aria-label="Höhen- und Wetterprofil">
        <div class="tl-head">
          <button type="button" class="tl-play" id="tlPlay" aria-label="Abspielen">
            <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor" /></svg>
            <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" fill="currentColor" /></svg>
          </button>
          <dl class="stats" id="stats"></dl>
        </div>
        <div class="tl-chart">
          <canvas id="profile" aria-label="Profil, klicken oder ziehen zum Spulen"></canvas>
          <div class="tl-foot">
            <div class="tl-legend" id="legend"></div>
            <p class="credits">
              Wetter <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> /
              <a href="https://api.met.no/" target="_blank" rel="noopener">MET Norway</a> ·
              Karte © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
              <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>,
              <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> ·
              Satellit Esri, Maxar, Earthstar Geographics · Nachtlichter NASA Black Marble ·
              Gelände Mapzen/AWS · Routing <a href="https://routing.openstreetmap.de/" target="_blank" rel="noopener">FOSSGIS OSRM</a> ·
              Suche <a href="https://photon.komoot.io/" target="_blank" rel="noopener">Photon</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
